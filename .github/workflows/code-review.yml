# Claude reviews every pull request against the rules, and answers replies to its comments. The workflow is Raineworks', in
# raine-works/agents (.github/workflows/code-review.yml): this file only calls it, and comes from the raineworks-base skill's
# templates/workflows/code-review.yml. Change the workflow there, for every repository at once; here, only its inputs
# (with:). The Base rules check moves the pin when the shared workflows change.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  code-review:
    name: Code review
    uses: raine-works/agents/.github/workflows/code-review.yml@3c5ed21e50ea3eb6160bad3d83a2a7f74a146d6a # raine-works/agents master
    secrets: inherit
    with:
      focus: |
        - Every script that changes a machine is safe to run again (checks first, skips when present, no failure from a false test under set -e).
        - Nothing overwrites a user's own config: shared config is included from a user-owned entry file, never symlinked, and nothing writes into the clone.
        - No secrets, tokens, emails, hostnames or personal details of any person in tracked files; git identity only in the user's own ~/.gitconfig.
        - shellcheck -x clean and shfmt -i 4 -ci formatted; the smoke check still passes.
        - Installers pass the tool's no-modify-rc flag; optional steps note and continue, core steps stop the run.
