name: Shell Quality

on:
  pull_request:
  push:
    branches: [master]

# The smoke check only reads the checkout: a read-only token, even for a pull request's code
permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt

      - name: Smoke check
        run: bash scripts/smoke-check.sh
